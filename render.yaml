# Render Blueprint: a Docker web service and a managed Postgres database.
# In Render: New > Blueprint > pick this repository. The first boot creates the schema and seeds 10,000 employees.
databases:
  - name: salary-manager-db
    plan: free
    region: singapore
    databaseName: salary_manager
    user: salary_manager
    postgresMajorVersion: "16"

services:
  - type: web
    name: salary-manager
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salary-manager-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      # One process keeps memory well inside the free plan's 512 MB.
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
