services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salary_manager
      POSTGRES_PASSWORD: salary_manager
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "salary_manager"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://salary_manager:salary_manager@db:5432/salary_manager
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-only-secret-change-me-for-any-real-deployment}
      FORCE_SSL: "false"
      WEB_CONCURRENCY: 2
      RAILS_MAX_THREADS: 3
      WRITE_RATE_LIMIT: ${WRITE_RATE_LIMIT:-60}
    ports:
      - "${APP_PORT:-8080}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit Net::HTTP.get_response(URI('http://localhost:3000/up')).is_a?(Net::HTTPSuccess) ? 0 : 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  db-data:
